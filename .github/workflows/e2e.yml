name: E2E Integration Tests

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

# Only run when the "run-e2e" label is added to a PR, or via manual dispatch.
jobs:
  e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify container runtime
        run: docker info

      - name: Run e2e tests
        working-directory: test/e2e
        run: go test -v -tags e2e -timeout 10m ./...
        env:
          SIGIL_CONTAINER_CLI: docker
          SIGIL_E2E_REQUIRED: "1"
